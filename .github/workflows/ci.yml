name: AEGIS Core CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install AEGIS Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q aegis

      - name: Run security and execution tests
        run: |
          python test_same_tool_call_execution.py
          python test_financial_loss_matrix.py
          python test_integration.py
          python test_signature_failure_rollback.py
          python test_idempotency_conflict.py
          python test_tool_call_binding.py
          python test_l3_settlement.py
          python test_micropayment_precision.py
          python test_key_failure_behavior.py
          python test_double_spend_1000.py
          python test_concurrency.py
          python test_enforcement.py